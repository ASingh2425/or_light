  <text x="410" y="255" font-family="monospace" font-size="10" fill="#fb923c">&gt; 22016     0x5600        PDF document</text>
  <text x="410" y="280" font-family="monospace" font-size="10" fill="#cbd5e1">&gt; carving complete: 3 files recovered</text>
  <text x="410" y="315" font-family="monospace" font-size="11" fill="#38bdf8" font-weight="bold">&gt;&gt; FRAGMENT TARGET: HIST_001 TO HIST_090</text>
