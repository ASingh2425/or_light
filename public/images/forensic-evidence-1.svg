    <rect x="70" y="165" width="44" height="28"/><rect x="122" y="165" width="44" height="28"/>
    <rect x="174" y="165" width="44" height="28"/><rect x="226" y="165" width="44" height="28"/>
    <rect x="278" y="165" width="44" height="28"/>
    <rect x="70" y="201" width="44" height="28"/><rect x="122" y="201" width="44" height="28"/>
    <rect x="174" y="201" width="44" height="28"/><rect x="226" y="201" width="44" height="28"/>
    <rect x="278" y="201" width="44" height="28"/>
  </g>
  <!-- three surviving allocations -->
  <rect x="70" y="237" width="44" height="28" fill="#047857" stroke="#4ade80" stroke-width="2"/>
  <rect x="174" y="237" width="44" height="28" fill="#047857" stroke="#4ade80" stroke-width="2"/>
  <rect x="278" y="237" width="44" height="28" fill="#047857" stroke="#4ade80" stroke-width="2"/>
