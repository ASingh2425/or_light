  <text x="120" y="480" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle" font-weight="bold">FORENSIC</text>
  <text x="120" y="496" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">VERIFIED</text>
  <text x="200" y="450" font-family="monospace" font-size="14" fill="#ffffff" font-weight="bold">CIVIC FORENSIC DIVISION — ORANGE ZONE VAULT EVIDENCE</text>
  <text x="200" y="475" font-family="monospace" font-size="11" fill="#93c5fd">Custodian: Dr. Aris Vane | Acquired 03:52 UTC via console port</text>
  <text x="200" y="500" font-family="monospace" font-size="11" fill="#cbd5e1">Raw dd image of sub-level terminal eMMC, slot B.</text>
  <text x="200" y="530" font-family="monospace" font-size="12" fill="#fb923c" font-weight="bold">STATUS: READY FOR DATASET FRAGMENT EXTRACTION</text>
