  <text x="196" y="255" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">2</text>
  <text x="300" y="255" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">3</text>
  <text x="210" y="290" font-family="monospace" font-size="11" fill="#f43f5e" text-anchor="middle" font-weight="bold">PURGE REPORTED: PLAINTEXT UNRECOVERABLE</text>
  <text x="210" y="315" font-family="monospace" font-size="11" fill="#facc15" text-anchor="middle">...the purge lied. 3 allocations survive.</text>
  <text x="210" y="355" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">image → photograph → document</text>
  <text x="210" y="372" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">read in order</text>

